name: Generate Snake Animation (Hacker Style)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Hacker Snake
        uses: Platane/snk@v3
        with:
          github_user_name: sajidexpertise
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Prepare output branch
        run: |
          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git reset --hard
          fi

      - name: Move generated snake files to repo root
        run: |
          if [ -f dist/github-contribution-grid-snake.svg ]; then
            cp dist/github-contribution-grid-snake.svg \
              github-contribution-grid-snake.svg
          fi

          if [ -f dist/github-contribution-grid-snake-dark.svg ]; then
            cp dist/github-contribution-grid-snake-dark.svg \
              github-contribution-grid-snake-dark.svg
          fi

      - name: Resize SVG files
        env:
          DESIRED_WIDTH: 1200
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          def resize(svg_path, width_px):
              if not os.path.exists(svg_path):
                  print(f"skip: {svg_path}")
                  return

              ET.register_namespace("", "http://www.w3.org/2000/svg")

              tree = ET.parse(svg_path)
              root = tree.getroot()
              view_box = root.get("viewBox")

              root.set("width", str(width_px))

              if view_box:
                  parts = list(map(float, view_box.split()))
                  original_width = parts[2]
                  original_height = parts[3]

                  if original_width:
                      new_height = round(
                          original_height * width_px / original_width
                      )
                      root.set("height", str(new_height))

              tree.write(
                  svg_path,
                  encoding="utf-8",
                  xml_declaration=True,
              )

          width = int(os.environ.get("DESIRED_WIDTH", "1200"))

          resize(
              "github-contribution-grid-snake.svg",
              width,
          )

          resize(
              "github-contribution-grid-snake-dark.svg",
              width,
          )
          PY

      - name: Commit and push snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg

          git commit \
            -m "Generate Hacker Snake animation [skip ci]" \
            || echo "No changes to commit"

          git push --force origin output
